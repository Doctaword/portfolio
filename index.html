<title>Andrew Dat Tran Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Layout: a printed portfolio book. Warm black pages so the paintings carry all the color;
   bone type, one brass accent for folio numbers and active controls. Single dark look by choice. */
:root{
  --ink:#100e0d; --leaf:#191614; --leaf-2:#231f1c; --rule:#352f2a;
  --bone:#ece5d8; --dust:#a39886; --brass:#c4a46b;
  --display:"Cormorant Garamond","Iowan Old Style","Palatino",Georgia,serif;
  --body:"Manrope","Avenir Next","Helvetica Neue",system-ui,sans-serif;
  --gut:clamp(16px,3.2vw,44px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--bone)}
body{margin:0;font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}
img{max-width:100%;display:block;-webkit-user-drag:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,.tile:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{padding-inline:var(--gut);max-width:1500px;margin-inline:auto}
.eyebrow{font:600 11px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--dust)}
.folio{font:500 13px/1 var(--display);font-style:italic;color:var(--brass);font-variant-numeric:lining-nums tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:16px;
  padding-block:12px;background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--rule)}
.bar .name{font:600 20px/1 var(--display);letter-spacing:.01em;white-space:nowrap}
.bar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding-inline:16px;border:1px solid var(--rule);border-radius:999px;
  font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--bone);white-space:nowrap}
.pill.primary{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.pill:active{transform:scale(.97)}
.back{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--dust);height:38px}

/* home */
.hero{position:relative;margin-block:var(--gut) 0;border-radius:4px;overflow:hidden;background:var(--leaf);aspect-ratio:16/8.2;max-height:62vh;width:100%}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,8,7,.86))}
.hero .cap{position:absolute;left:clamp(18px,3vw,40px);right:clamp(18px,3vw,40px);bottom:clamp(18px,3vw,36px);z-index:1;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hero h1{margin:0;font:500 clamp(40px,6.4vw,84px)/.95 var(--display);letter-spacing:-.01em;text-wrap:balance}
.hero h1 em{font-style:italic;color:var(--brass)}
.hero .roles{margin-top:10px;color:var(--bone);opacity:.82;font-size:15px}
.hero .cap .sp{flex:1}
.intro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(20px,4vw,64px);padding-block:clamp(28px,4vw,52px) 8px;border-bottom:1px solid var(--rule)}
.intro p{margin:0;font:500 clamp(20px,2.3vw,26px)/1.35 var(--display);max-width:34ch}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-content:start}
.fact b{display:block;font:500 clamp(28px,3.4vw,40px)/1 var(--display);color:var(--bone);font-variant-numeric:lining-nums}
.fact span{display:block;margin-top:6px;color:var(--dust);font-size:12px;line-height:1.35}
.toc-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-block:28px 14px}
.toc-head h2{margin:0;font:500 30px/1 var(--display)}
.toc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,26px);padding-bottom:48px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left}
.tile .cv{aspect-ratio:4/3;border-radius:3px;overflow:hidden;background:var(--leaf)}
.tile .cv img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.tile:active .cv img{transform:scale(1.03)}
.tile .meta{display:flex;gap:12px;align-items:baseline}
.tile h3{margin:0;font:500 22px/1.1 var(--display);text-wrap:balance}
.tile .k{color:var(--dust);font-size:12px;margin-top:3px;line-height:1.35}
.tile .n{margin-left:auto;color:var(--dust);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* section */
.shead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(16px,4vw,56px);padding-block:clamp(24px,3.5vw,44px) 24px;align-items:end}
.shead h2{margin:8px 0 0;font:500 clamp(36px,5vw,64px)/1 var(--display);text-wrap:balance}
.shead p{margin:0;color:var(--dust);max-width:58ch;font-size:15px}
.rows{display:flex;flex-direction:column;gap:8px;padding-bottom:28px}
.row{display:flex;gap:8px}
.cell{position:relative;flex:none;overflow:hidden;border-radius:2px;background:var(--leaf)}
.cell.alpha{background:radial-gradient(circle at 50% 40%,var(--leaf-2),var(--leaf))}
.cell img{width:100%;height:100%;object-fit:cover}
.cell.alpha img{object-fit:contain}
.cell .hid{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(16,14,13,.72);font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--bone)}
.editing .cell{outline:1px dashed var(--rule);outline-offset:-1px}
.cell.off .hid{display:flex}
body:not(.editing) .cell.off{display:none}
.next{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--rule);padding-block:22px 48px}
.next button{text-align:right}
.next .t{font:500 26px/1.1 var(--display)}
.editbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px;border:1px solid var(--brass);border-radius:6px;color:var(--bone);font-size:13px}
.editbar .sp{flex:1}

/* about */
.about{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:clamp(20px,4vw,60px);padding-block:clamp(24px,4vw,48px)}
.about .pic{border-radius:3px;overflow:hidden;aspect-ratio:1;background:var(--leaf)}
.about h2{margin:6px 0 14px;font:500 clamp(36px,4.6vw,58px)/1 var(--display)}
.about .lede{font:500 21px/1.4 var(--display);margin:0 0 22px;max-width:46ch}
.cv-list{display:grid;gap:0;border-top:1px solid var(--rule)}
.cv-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding-block:14px;border-bottom:1px solid var(--rule)}
.cv-item b{font-weight:700}
.cv-item .when{color:var(--dust);font-variant-numeric:tabular-nums;font-size:13px}
.cv-item .what{grid-column:1/-1;color:var(--dust);font-size:14px}
.contact{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:22px}
.contact div span{display:block}
.contact .v{font-size:16px;-webkit-user-select:text;user-select:text}
.settings{margin-top:34px;padding-top:20px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.settings .note{color:var(--dust);font-size:13px;flex-basis:100%}

/* lean overrides */
.ibtn{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rule);color:var(--bone);flex:none}
.ibtn.solid{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.cover{position:relative;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:520px;overflow:hidden;background:var(--leaf)}
.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(16,14,13,.88))}
.cover .cap{position:absolute;left:var(--gut);right:var(--gut);bottom:clamp(28px,5vh,56px);z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.cover h1{margin:0;font:500 clamp(44px,6vw,72px)/1 var(--display)}
.cover .sub{margin-top:8px;font:italic 500 clamp(20px,2.4vw,28px)/1.2 var(--display);color:var(--brass)}
.cover .play{width:88px;height:88px;border-radius:50%;background:var(--bone);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.cover .top{position:absolute;top:24px;right:var(--gut);z-index:1}
.grid12{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding-block:var(--gut)}
.grid12 .lt:nth-child(1),.grid12 .lt:nth-child(2),.grid12 .lt:nth-child(8),.grid12 .lt:nth-child(12){grid-column:span 2;aspect-ratio:auto;height:100%;min-height:calc((100vw - 2*var(--gut) - 42px)/4*.75)}
.lt{position:relative;aspect-ratio:4/3;border-radius:4px;overflow:hidden;background:var(--leaf);text-align:left}
.lt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lt::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 52%,rgba(16,14,13,.9))}
.lt .lbl{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;display:flex;gap:10px;align-items:baseline}
.lt .lbl b{font:500 22px/1.05 var(--display)}
.stitle{display:flex;align-items:baseline;gap:16px;padding-block:22px 18px}
.stitle h2{margin:0;font:500 clamp(36px,4.6vw,56px)/1 var(--display)}
.opener{position:absolute;inset:0}
.opener img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.42) saturate(.9)}
.opener .t{position:absolute;left:clamp(32px,8vw,96px);bottom:clamp(60px,14vh,120px);display:flex;flex-direction:column;gap:10px}
.opener .t h2{margin:0;font:500 clamp(56px,9vw,112px)/.95 var(--display);color:var(--bone)}
.opener .t .folio{font-size:30px}
@media (max-width:900px){.grid12{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* viewer */
.viewer{position:fixed;inset:0;z-index:100;background:#000;touch-action:none;overflow:hidden}
.track{position:absolute;inset:0}
.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;will-change:transform}
.panel img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transform-origin:0 0;will-change:transform}
.panel .card{max-width:min(720px,84vw);text-align:left}
.panel .card .folio{font-size:18px}
.panel .card h2{margin:14px 0 18px;font:500 clamp(44px,7vw,92px)/.98 var(--display);text-wrap:balance;color:var(--bone)}
.panel .card .eyebrow{color:var(--brass)}
.panel .card p{color:var(--dust);font-size:17px;line-height:1.6;max-width:56ch;margin:0}
.chrome{position:absolute;left:0;right:0;display:flex;align-items:center;gap:14px;padding-inline:max(var(--gut),env(safe-area-inset-left,0px));transition:opacity .25s ease}
.chrome.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:20px}
.chrome.bot{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-top:36px;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.viewer.bare .chrome{opacity:0;pointer-events:none}
.chrome .sec{font:500 19px/1.1 var(--display);color:var(--bone)}
.chrome .cap{color:var(--dust);font-size:13px;margin-top:3px}
.chrome .ct{margin-left:auto;color:var(--dust);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(236,229,216,.22);color:var(--bone);flex:none}
.prog{position:absolute;left:0;bottom:0;height:2px;background:var(--brass);transition:width .3s ease}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--dust);font-size:13px;pointer-events:none}

@media (max-width:900px){

</style>

<div id="app"></div>

<script src="data.js"></script>
<script>
(()=>{
const P=window.PORTFOLIO, S=P.sections;
const $=(s,r=document)=>r.querySelector(s);
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const full=k=>`img/${k}.webp`, thumb=k=>`img/${k}.t.webp`;
const app=$('#app');

// per-viewer hidden pieces (last-minute curation on the iPad)
let hidden=new Set();
try{hidden=new Set(JSON.parse(localStorage.getItem('adt.hidden')||'[]'))}catch(e){}
const saveHidden=()=>{try{localStorage.setItem('adt.hidden',JSON.stringify([...hidden]))}catch(e){}};
const visible=s=>s.items.filter(i=>!hidden.has(i.k));
const pad=n=>String(n).padStart(2,'0');
const ICON={
  x:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l12 12M15 3L3 15"/></svg>',
  l:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 3L5 9l6 6"/></svg>',
  r:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 3l6 6-6 6"/></svg>',
  play:'<svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg>',
  me:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="6" r="3"/><path d="M3 16c0-3.3 2.7-5 6-5s6 1.7 6 5"/></svg>',
  grid:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="2.5" width="5" height="5"/><rect x="10.5" y="2.5" width="5" height="5"/><rect x="2.5" y="10.5" width="5" height="5"/><rect x="10.5" y="10.5" width="5" height="5"/></svg>'
};

/* ---------- routing ---------- */
function go(view,arg){ if(view!=='section') document.body.classList.remove('editing'); state={view,arg}; render(); window.scrollTo(0,0); try{sessionStorage.setItem('adt.view',JSON.stringify(state))}catch(e){} }
let state={view:'home'}; try{const s=JSON.parse(sessionStorage.getItem('adt.view'));if(s&&s.view)state=s}catch(e){}

function bar(extra=''){
  return `<header class="bar wrap">${extra||'<button class="name" data-go="home">Andrew Dat Tran</button>'}<span class="sp"></span>
  <button class="ibtn" data-go="about" aria-label="About">${ICON.me}</button>
  <button class="ibtn solid" data-present="0" aria-label="Present">${ICON.play}</button></header>`;
}

function render(){
  if(state.view==='section') return renderSection(+state.arg);
  if(state.view==='about') return renderAbout();
  renderHome();
}

function renderHome(){
  const tiles=S.map((s,i)=>{const v=visible(s); if(!v.length) return '';
    const cover=(s.cover&&!hidden.has(s.cover))?s.cover:v[0].k;
    return `<button class="lt" data-go="section" data-arg="${i}"><img loading="lazy" src="${thumb(cover)}" alt="">
      <span class="lbl"><span class="folio">${pad(i+1)}</span><b>${esc(s.short||s.title)}</b></span></button>`}).join('');
  app.innerHTML=`
  <section class="cover"><img src="${full(P.hero)}" alt="Warcry, illustration by Andrew Dat Tran">
    <div class="top"><button class="ibtn" data-go="about" aria-label="About" style="border-color:rgba(236,229,216,.35)">${ICON.me}</button></div>
    <div class="cap"><div><h1>Andrew Dat Tran</h1><div class="sub">Illustration &amp; Visual Development</div></div>
      <button class="play" data-present="0" aria-label="Begin presentation"><svg width="28" height="28" viewBox="0 0 28 28"><path d="M9 5l15 9-15 9z" fill="currentColor"/></svg></button></div>
  </section>
  <main class="wrap"><section class="grid12">${tiles}</section></main>`;
}

function layoutRows(items,width,target){
  const gap=8, rows=[]; let row=[], sum=0;
  for(const it of items){ row.push(it); sum+=it.w/it.h;
    const h=(width-gap*(row.length-1))/sum;
    if(h<=target){ rows.push({row,h}); row=[]; sum=0; } }
  if(row.length) rows.push({row,h:Math.min(target*1.1,(width-gap*(row.length-1))/sum),last:true});
  return rows;
}
function renderSection(i){
  const s=S[i]; if(!s) return go('home');
  const editing=document.body.classList.contains('editing');
  const nextS=S[i+1];
  app.innerHTML=bar(`<button class="ibtn" data-go="home" aria-label="Back">${ICON.l}</button>`)+`
  <main class="wrap">
    <section class="stitle"><span class="folio" style="font-size:22px">${pad(i+1)}</span><h2>${esc(s.title)}</h2></section>
    <div id="editbar"></div>
    <div class="rows" id="rows"></div>
    <nav class="next"><button class="ibtn solid" data-present-sec="${i}" aria-label="Present this section">${ICON.play}</button>
      ${nextS?`<button data-go="section" data-arg="${i+1}"><div class="t">${esc(nextS.title)} ${ICON.r}</div></button>`:''}
    </nav>
  </main>`;
  drawRows(i);
}
function drawRows(i){
  const s=S[i], box=$('#rows'); if(!box) return;
  const editing=document.body.classList.contains('editing');
  const items=editing?s.items:visible(s);
  const W=box.clientWidth, target=W>1000?300:W>700?240:170;
  box.innerHTML=layoutRows(items,W,target).map(({row,h})=>`<div class="row">${row.map(it=>
    `<button class="cell${it.a?' alpha':''}${hidden.has(it.k)?' off':''}" data-k="${it.k}" style="width:${(it.w/it.h*h).toFixed(1)}px;height:${h.toFixed(1)}px" aria-label="${esc(it.c||s.title)}">
      <img loading="lazy" src="${thumb(it.k)}" alt=""><span class="hid">Hidden</span></button>`).join('')}</div>`).join('');
  $('#editbar').innerHTML=editing?`<div class="editbar"><span>Tap pieces to hide or show them. Hidden pieces are skipped in the gallery and in Present.</span><span class="sp"></span><button class="pill primary" data-edit="off">Done</button></div>`:'';
}

function renderAbout(){
  app.innerHTML=bar(`<button class="ibtn" data-go="home" aria-label="Back">${ICON.l}</button>`)+`
  <main class="wrap"><section class="about" style="align-items:center;min-height:70vh">
    <div><div class="pic"><img src="${full(P.portrait)}" alt="Portrait of Andrew Dat Tran"></div></div>
    <div style="min-width:0;display:flex;flex-direction:column;gap:26px">
      <div><h2 style="margin:0">Andrew Dat Tran</h2><div class="sub" style="font:italic 500 26px/1.2 var(--display);color:var(--brass);margin-top:8px">Illustration &amp; Visual Development</div></div>
      <div style="display:flex;flex-wrap:wrap;gap:10px 32px;color:var(--dust);font-size:13px"><span>Broken Circle</span><span>Titmouse</span><span>Liquid Development</span><span>LCAD</span></div>
      <div class="v" style="font-size:20px;-webkit-user-select:text;user-select:text">tranandrew16@gmail.com</div>
      <div class="settings" style="margin-top:12px">
        <button class="pill" data-edit="on">Choose pieces</button>
        <button class="pill" data-reset>Show all</button>
        <span class="eyebrow" id="offline"></span>
      </div>
    </div></section></main>`;
  offlineStatus();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.go){ go(b.dataset.go,b.dataset.arg); return; }
  if(b.dataset.present!=null){ present(null,0); return; }
  if(b.dataset.presentSec!=null){ present(+b.dataset.presentSec,0); return; }
  if(b.dataset.edit==='on'){ go('section',0); document.body.classList.add('editing'); drawRows(0); return; }
  if(b.dataset.edit==='off'){ document.body.classList.remove('editing'); drawRows(+state.arg); return; }
  if(b.hasAttribute('data-reset')){ hidden.clear(); saveHidden(); render(); return; }
  if(b.dataset.k){
    const i=+state.arg, s=S[i];
    if(document.body.classList.contains('editing')){
      hidden.has(b.dataset.k)?hidden.delete(b.dataset.k):hidden.add(b.dataset.k); saveHidden(); b.classList.toggle('off'); return; }
    const v=visible(s); open(v.map(it=>({it,s,si:i})), v.findIndex(it=>it.k===b.dataset.k), false);
  }
});
let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(state.view==='section')drawRows(+state.arg)},120)});

/* ---------- viewer ---------- */
function present(onlySec){
  const list=[];
  S.forEach((s,si)=>{ if(onlySec!=null&&si!==onlySec) return; const v=visible(s); if(!v.length) return;
    list.push({card:true,s,si}); v.forEach(it=>list.push({it,s,si})); });
  open(list,0,true);
}
let V=null;
function open(list,start,presenting){
  if(!list.length) return;
  const root=el(`<div class="viewer" role="dialog" aria-label="Artwork viewer">
    <div class="track"></div>
    <div class="chrome top"><button class="iconbtn" data-x aria-label="Close" style="background:rgba(0,0,0,.45)">${ICON.x}</button>
      <div style="min-width:0;display:none"><div class="sec"></div><div class="cap"></div></div><span class="ct"></span></div>
    <div class="prog"></div></div>`);
  document.body.appendChild(root); document.documentElement.style.overflow='hidden';
  V={root,list,i:Math.max(0,start),panels:[],presenting,z:{s:1,x:0,y:0}};
  const track=$('.track',root);
  for(let k=0;k<3;k++){const p=el('<div class="panel"></div>');track.appendChild(p);V.panels.push(p)}
  root.addEventListener('click',e=>{
    if(e.target.closest('[data-x]')) return close();
    if(e.target.closest('[data-p]')) return step(-1);
    if(e.target.closest('[data-n]')) return step(1);
  });
  bindGestures(root);
  fill(); wake(true);
}
function close(){ if(!V) return; V.root.remove(); V=null; document.documentElement.style.overflow=''; wake(false); }
function slideHTML(x){
  if(!x) return '';
  if(x.card){ const c=(x.s.cover&&!hidden.has(x.s.cover))?x.s.cover:(visible(x.s)[0]||{}).k;
    return `<div class="opener">${c?`<img src="${full(c)}" alt="">`:''}<div class="t"><span class="folio">${pad(x.si+1)}</span><h2>${esc(x.s.title)}</h2></div></div>`; }
  return `<img src="${full(x.it.k)}" alt="${esc(x.it.c||x.s.title)}" draggable="false">`;
}
function fill(){
  const {list,i,panels}=V;
  [-1,0,1].forEach((d,k)=>{const p=panels[k]; p.innerHTML=slideHTML(list[i+d]); p.style.transition='none'; p.style.transform=`translate3d(${d*100}%,0,0)`;});
  V.z={s:1,x:0,y:0};
  const x=list[i];
  $('.sec',V.root).textContent=x.s.title;
  $('.cap',V.root).textContent=x.card?'':(x.it.c||'');
  const pieces=list.filter(y=>!y.card), n=pieces.indexOf(x)+1;
  $('.ct',V.root).textContent=x.card?'':`${n} / ${pieces.length}`;
  $('.prog',V.root).style.width=((i+1)/list.length*100)+'%';
  [2,3].forEach(d=>{const y=list[i+d]; if(y&&!y.card){const im=new Image(); im.src=full(y.it.k);}});
}
function step(d){
  if(!V) return; const j=V.i+d; if(j<0||j>=V.list.length) return snap();
  const [a,b,c]=V.panels;
  [a,b,c].forEach(p=>p.style.transition='transform .32s cubic-bezier(.2,.7,.2,1)');
  a.style.transform=`translate3d(${(-1-d)*100}%,0,0)`; b.style.transform=`translate3d(${-d*100}%,0,0)`; c.style.transform=`translate3d(${(1-d)*100}%,0,0)`;
  // rotate panels so the incoming one becomes the middle without reloading its image
  setTimeout(()=>{ if(!V) return; V.i=j;
    if(d>0){ V.panels.push(V.panels.shift()); } else { V.panels.unshift(V.panels.pop()); }
    const [p0,p1,p2]=V.panels;
    [p0,p1,p2].forEach((p,k)=>{p.style.transition='none';p.style.transform=`translate3d(${(k-1)*100}%,0,0)`});
    const nb=d>0?p2:p0; nb.innerHTML=slideHTML(V.list[j+d]);
    const img=$('img',p1); if(img) img.style.transform='';
    V.z={s:1,x:0,y:0}; updateChrome();
  },330);
}
function updateChrome(){ // like fill() but without touching panel contents
  const x=V.list[V.i];
  $('.sec',V.root).textContent=x.s.title; $('.cap',V.root).textContent=x.card?'':(x.it.c||'');
  const pieces=V.list.filter(y=>!y.card), n=pieces.indexOf(x)+1;
  $('.ct',V.root).textContent=x.card?'':`${n} / ${pieces.length}`;
  $('.prog',V.root).style.width=((V.i+1)/V.list.length*100)+'%';
  [2,3].forEach(d=>{const y=V.list[V.i+d]; if(y&&!y.card){const im=new Image(); im.src=full(y.it.k);}});
}
function snap(){ V.panels.forEach((p,k)=>{p.style.transition='transform .25s ease';p.style.transform=`translate3d(${(k-1)*100}%,0,0)`}); }

function bindGestures(root){
  let t0=null, startX=0, startY=0, dx=0, mode=null, pinch=null, lastTap=0, moved=false;
  const img=()=>$('img',V.panels[1]);
  const applyZ=()=>{const m=img(); if(m) m.style.transform=V.z.s>1?`translate(${V.z.x}px,${V.z.y}px) scale(${V.z.s})`:'';};
  const clampZ=()=>{const m=img(); if(!m) return; const w=m.offsetWidth,h=m.offsetHeight,s=V.z.s;
    V.z.x=Math.min(0,Math.max(w-w*s,V.z.x)); V.z.y=Math.min(0,Math.max(h-h*s,V.z.y)); if(s<=1){V.z={s:1,x:0,y:0}}};
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  root.addEventListener('touchstart',e=>{
    if(e.target.closest('.chrome button')) return;
    moved=false;
    if(e.touches.length===2&&img()){ const m=img(),r=m.getBoundingClientRect();
      const cx=(e.touches[0].clientX+e.touches[1].clientX)/2, cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
      pinch={d:dist(e.touches),s:V.z.s,x:V.z.x,y:V.z.y,px:cx-r.left,py:cy-r.top,ox:r.left-V.z.x,oy:r.top-V.z.y}; mode='pinch'; snap(); return; }
    const t=e.touches[0]; startX=t.clientX; startY=t.clientY; dx=0; mode=V.z.s>1?'pan':null; t0={x:V.z.x,y:V.z.y};
  },{passive:true});
  root.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(mode==='pinch'&&e.touches.length===2){ moved=true;
      const s=Math.min(5,Math.max(1,pinch.s*dist(e.touches)/pinch.d));
      const cx=(e.touches[0].clientX+e.touches[1].clientX)/2, cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
      // keep the image point under the fingers fixed
      const ix=(pinch.px)/pinch.s, iy=(pinch.py)/pinch.s;
      V.z.s=s; V.z.x=(cx-pinch.ox)-ix*s; V.z.y=(cy-pinch.oy)-iy*s; applyZ(); return; }
    if(e.touches.length!==1) return;
    const t=e.touches[0], mx=t.clientX-startX, my=t.clientY-startY;
    if(Math.abs(mx)>6||Math.abs(my)>6) moved=true;
    if(mode==='pan'){ V.z.x=t0.x+mx; V.z.y=t0.y+my; clampZ(); applyZ(); return; }
    if(!mode&&Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)) mode='swipe';
    if(!mode&&Math.abs(my)>14&&Math.abs(my)>Math.abs(mx)) mode='dismiss';
    if(mode==='swipe'){ dx=mx; const edge=(V.i===0&&dx>0)||(V.i===V.list.length-1&&dx<0)?.35:1;
      V.panels.forEach((p,k)=>{p.style.transition='none';p.style.transform=`translate3d(calc(${(k-1)*100}% + ${dx*edge}px),0,0)`}); }
    if(mode==='dismiss'&&my>0){ V.panels[1].style.transition='none'; V.panels[1].style.transform=`translate3d(0,${my}px,0)`; V.root.style.background=`rgba(0,0,0,${Math.max(.3,1-my/500)})`; dx=my; }
  },{passive:false});
  root.addEventListener('touchend',e=>{
    if(e.target.closest('.chrome button')) return;
    if(mode==='pinch'){ if(e.touches.length===0){ clampZ(); applyZ(); mode=null; } return; }
    if(mode==='swipe'){ const w=root.clientWidth; mode=null;
      if(dx<-w*.12) step(1); else if(dx>w*.12) step(-1); else snap(); return; }
    if(mode==='dismiss'){ mode=null; if(dx>120) return close(); V.root.style.background=''; snap(); return; }
    if(mode==='pan'){ mode=null; if(moved) return; }
    mode=null; if(moved) return;
    // tap / double tap
    const now=Date.now();
    if(now-lastTap<280){ lastTap=0; clearTimeout(V.tapT); const m=img(); if(!m) return;
      if(V.z.s>1){ V.z={s:1,x:0,y:0}; }
      else{ const r=m.getBoundingClientRect(), s=2.5, px=startX-r.left, py=startY-r.top; V.z={s,x:px-px*s,y:py-py*s}; clampZ(); }
      m.style.transition='transform .25s ease'; applyZ(); setTimeout(()=>{if(m)m.style.transition=''},260); return; }
    lastTap=now; V.tapT=setTimeout(()=>{ if(V) V.root.classList.toggle('bare'); },290);
  });
  ['gesturestart','gesturechange'].forEach(ev=>root.addEventListener(ev,e=>e.preventDefault()));
  // mouse / keyboard for laptops
  root.addEventListener('wheel',e=>{ if(Math.abs(e.deltaX)>40){ step(e.deltaX>0?1:-1); } },{passive:true});
}
addEventListener('keydown',e=>{ if(!V) return;
  if(e.key==='ArrowRight'||e.key===' ') {e.preventDefault();step(1)} else if(e.key==='ArrowLeft') step(-1); else if(e.key==='Escape') close(); });

/* keep the screen on while presenting */
let lock=null;
async function wake(on){ try{ if(on&&navigator.wakeLock) lock=await navigator.wakeLock.request('screen'); else if(lock){lock.release();lock=null} }catch(e){} }

/* ---------- offline ---------- */
async function offlineStatus(){
  const o=$('#offline'); if(!o) return;
  try{
    if(!('caches' in window)||!navigator.serviceWorker||!navigator.serviceWorker.controller){ o.textContent='Online preview'; return; }
    const keys=await caches.keys(); let n=0; for(const k of keys){ n+=(await (await caches.open(k)).keys()).length; }
    const need=(window.PRECACHE||[]).length;
    o.textContent=need&&n>=need?'Saved for offline':`Saving for offline · ${n} of ${need}`;
    if(need&&n<need) setTimeout(offlineStatus,1500);
  }catch(e){ o.textContent=''; }
}
if('serviceWorker' in navigator && window.PRECACHE){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

render();
})();
</script>
